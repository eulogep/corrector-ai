name: corrector-ai

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD requis}"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  corrector-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: corrector-ai:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DEBUG: "false"
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    ports:
      # L'application reste privée ; utiliser le proxy TLS optionnel pour l'exposer sur Internet.
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - corrector_data:/data
      - ./.secrets/metrics_token:/run/secrets/metrics_token:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Nécessaires uniquement au point d'entrée pour préparer /data puis abandonner root.
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  corrector_data:
    name: corrector_ai_data
  redis_data:
    name: corrector_ai_redis_data
