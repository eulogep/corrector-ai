global:
  resolve_timeout: 5m

route:
  receiver: corrector-ai-webhook
  group_by: [alertname, service, provider]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: corrector-ai-webhook
    webhook_configs:
      - url: https://notifications.example.invalid/corrector-ai/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_webhook_token
