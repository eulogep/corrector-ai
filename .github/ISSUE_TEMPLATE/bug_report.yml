name: Rapport de bug
description: Signaler un comportement reproductible de Corrector AI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci. N’ajoutez aucune copie d’élève, donnée personnelle, clé API, jeton ou mot de passe.
  - type: textarea
    id: problem
    attributes:
      label: Comportement observé
      description: Décrivez précisément le problème et son impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes de reproduction
      description: Donnez une reproduction minimale avec données fictives ou anonymisées.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit
      placeholder: e949493 ou tag de déploiement
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Domaine concerné
      options:
        - OCR
        - Correction ou barème LLM
        - Cache Redis
        - API ou authentification
        - Rapports
        - Déploiement ou monitoring
        - Frontend
  - type: textarea
    id: environment
    attributes:
      label: Environnement et logs expurgés
      description: Version Python, système, déploiement et logs sans données sensibles.
