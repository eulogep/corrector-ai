services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Définir DOMAIN dans l'environnement du shell}
      ACME_EMAIL: ${ACME_EMAIL:?Définir ACME_EMAIL dans l'environnement du shell}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      corrector-ai:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy_data:
    name: corrector_ai_caddy_data
  caddy_config:
    name: corrector_ai_caddy_config
