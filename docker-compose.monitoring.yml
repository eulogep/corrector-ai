services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle=false
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./.secrets/metrics_token:/run/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      # Interface de diagnostic réservée à l'hôte ; ne pas publier Internet directement.
      - "127.0.0.1:9090:9090"
    depends_on:
      corrector-ai:
        condition: service_healthy
      alertmanager:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./.secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Réservé à l'hôte ; utiliser un tunnel SSH ou un proxy authentifié.
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
    name: corrector_ai_prometheus_data
  alertmanager_data:
    name: corrector_ai_alertmanager_data
  grafana_data:
    name: corrector_ai_grafana_data
